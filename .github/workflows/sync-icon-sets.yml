name: Sync icon sets catalog

on:
  schedule:
    # Daily at 03:00 UTC — keeps icon-sets.json (counts, variants, latest
    # versions) fresh without any runtime network calls in ichava:install.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: curl, json, mbstring

      - name: Sync icon-sets.json from pack repositories
        run: php bin/sync-icon-sets.php
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open catalog sync pull request
        run: |
          set -euo pipefail
          # Single stable branch, so every run updates the same PR instead of
          # opening duplicates. main is branch-protected (PR-only), so never
          # push there directly.
          BRANCH='chore/sync-icon-sets'
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- icon-sets.json; then
            echo 'icon-sets.json unchanged; nothing to do.'
            exit 0
          fi
          # Fetch the stable branch before branching off main, so --force-with-lease
          # has a remote-tracking ref to compare against. `actions/checkout` fetches
          # only the default branch, so without this there is no
          # refs/remotes/origin/$BRANCH, the lease has no basis, and git rejects the
          # push with "stale info" -- which reads like a race and is not one. It only
          # bit on days the branch already existed: creating a ref needs no lease, so
          # the first run after a merge passed and every run after it failed.
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git checkout -B "$BRANCH"
          git add icon-sets.json
          git commit -m 'docs: sync icon-sets catalog' || true
          # Lease kept rather than dropped for --force: it still refuses to clobber a
          # push that arrived after the fetch above, which is the case it exists for.
          git push --force-with-lease origin "$BRANCH"
          if gh pr view "$BRANCH" --json number --jq .number >/dev/null 2>&1; then
            echo "Pull request already open for $BRANCH; updated in place."
          else
            gh pr create --base main --head "$BRANCH" --title 'docs: sync icon-sets catalog' --body 'Automated refresh of icon-sets.json.'
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
