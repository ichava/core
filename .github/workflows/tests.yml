name: Tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.4, 8.5]
        laravel: [13.*]
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: ^11.0

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: xdebug

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        # Coverage floor reflects current reality (~20%) with a buffer
        # so test additions/removals don't flap the gate. Ratchet target
        # is 80%; bump --min by +5 percentage points whenever the suite
        # stably reports above that bound for two consecutive runs.
        # NEVER lower the floor without a release note. See CONTRIBUTING.md
        # "Coverage ratchet" section.
        # `--coverage-clover` produces the xml file codecov-action consumes.
        run: vendor/bin/pest --coverage --min=15 --coverage-clover=coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.php == '8.4' && matrix.laravel == '13.*'
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          # Don't fail the whole pipeline on a codecov upload glitch --
          # the gate is the `--min=` flag above, not the upload step.
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # The same suite against every database this package supports.
  #
  # The job above runs on in-memory SQLite, which is the fast lane and cannot see
  # a difference between drivers: index-length limits, JSON column semantics,
  # `ON CONFLICT` versus `ON DUPLICATE KEY`, foreign-key enforcement, and the
  # whole PostgreSQL full-text path that SQLite never reaches. Those only show up
  # against a real server, so they run here.
  #
  # SQLite is not repeated -- the job above is its lane.
  # ---------------------------------------------------------------------------
  test-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - db: pgsql
            image: postgres:17
            port: 5432
            health: >-
              --health-cmd="pg_isready -U ichava -d ichava_test"
              --health-interval=10s --health-timeout=5s --health-retries=10
          - db: mysql
            image: mysql:8.4
            port: 3306
            health: >-
              --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psecret"
              --health-interval=10s --health-timeout=5s --health-retries=10
          - db: mariadb
            image: mariadb:11.4
            port: 3306
            health: >-
              --health-cmd="healthcheck.sh --connect --innodb_initialized"
              --health-interval=10s --health-timeout=5s --health-retries=10

    name: DB ${{ matrix.db }} - P8.4 - L13.*

    services:
      database:
        image: ${{ matrix.image }}
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        # One env block serves all three images. Each reads only its own prefix
        # and ignores the rest, which keeps this a single service definition
        # instead of three near-identical jobs.
        env:
          POSTGRES_DB: ichava_test
          POSTGRES_USER: ichava
          POSTGRES_PASSWORD: secret
          MYSQL_DATABASE: ichava_test
          MYSQL_USER: ichava
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: secret
          MARIADB_DATABASE: ichava_test
          MARIADB_USER: ichava
          MARIADB_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: secret
        options: ${{ matrix.health }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:^11.0" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: ichava_test
          DB_USERNAME: ichava
          DB_PASSWORD: secret
        run: vendor/bin/pest
